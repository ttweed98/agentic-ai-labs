---
get_intended_config:
  owner: "Network Automation Team"
  purpose: "Return the configuration this device was designed to have, as written before deployment"
  arguments:
    device:
      type: string
      required: true
      validation: "must be present in inventory/approved_devices.yml"
  returns:
    device:
      type: string
      source: "the argument, echoed back"
      example: "leaf1"
    config:
      type: string
      source: "the full text of lab/configs/<device>.cfg"
      note: "the intended configuration, not the running configuration. It states
             what was designed, including interface descriptions, and its absences
             are meaningful: a peer or interface not present here was never designed"
  blocked_when:
    - "not_approved — device not present in inventory/approved_devices.yml"
    - "config_not_found — no lab/configs/<device>.cfg exists"
    - "config_empty — the file exists but contains nothing"
  logs:
    timestamp:        "UTC ISO-8601, when the call started"
    tool:             "get_intended_config"
    caller:           "what invoked it - agent session ID, 'cli', or job name"
    requested_device: "device exactly as specified in the argument"
    approved:         "true | false - did it pass inventory/approved_devices.yml"
    outcome:          "successful | refused | error"
    blocked_reason:   "the token of the blocked_when case that fired; null on success"
    detail:           "the observation, not the conclusion"
    line_count:       "how many lines the returned config contains"
    duration_ms:      "elapsed time of the call"