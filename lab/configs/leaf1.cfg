!
hostname leaf1
!
interface Ethernet1
   description P2P_TO_SPINE1
   no switchport
   ip address 10.1.1.0/31
   
!
interface Ethernet2
   description P2P_TO_SPINE2
   no switchport
   ip address 10.1.2.0/31
   
!
interface Ethernet3
   description P2P_TO_HOST1
   no switchport
   ip address 10.100.1.1/24

!
interface Loopback0
   ip address 10.1.0.1/32
!
router bgp 65002
   router-id 10.1.0.1
   maximum-paths 2
   neighbor 10.1.1.1 remote-as 65001
   neighbor 10.1.2.1 remote-as 65001
   network 10.1.0.1/32
   network 10.100.1.0/24


!
username admin privilege 15 role network-admin secret admin
!
management api http-commands
   no shutdown
   vrf MGMT
      no shutdown
!
management api gnmi
   transport grpc default
   no shutdown
!
management api netconf
   transport ssh default
!
vrf instance MGMT
!
interface Management0
   vrf MGMT
   no shutdown
!
ip routing
!
ip routing vrf MGMT
!
management ssh
   vrf MGMT
      no shutdown
!
end