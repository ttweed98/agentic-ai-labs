---
get_device_status:
  owner: "Network Automation Team"
  purpose: "Return the identity of the requested device as the device itself reports it."
  arguments:
    device:
     type: string
     required: true
     validation: "must be present in inventory/approved_devices.yml"
  returns:
    hostname:
      type: string
      source: "show hostname | json → hostname"
      example: "leaf1"
    manufacturer:
      type: string
      source: "show version | json → mfgName"
      example: "Arista"
    model:
      type: string
      source: "show version | json → modelName"
      example: "cEOSLab"
    serial_number:
      type: string
      source: "show version | json → serialNumber"
      example: "B7970938E8A18A54B1819C126815725C"
    system_mac_address:
      type: string
      source: "show version | json → systemMacAddress"
      example: "00:1c:73:1d:d1:2e"
    software_version:
      type: string
      source: "show version | json → version"
      example: "4.34.0F-41661064.4340F (engineering build)"
    uptime_seconds:
      type: float
      source: "show version | json → uptime"
      example: 75.01530408859253
  blocked_when:
    - "not_approved — device not present in inventory/approved_devices.yml"
    - "hostname_mismatch — device reported a different hostname than requested"
    - "auth_rejected — credentials refused by the device"
    - "eapi_refused — connection refused, curl exit 7. Cause not determinable from
       the client: service down, still starting, or bound to another VRF"
    - "no_response — no answer from the target address, curl exit 28 (timeout).
       Cannot confirm a device is present"
    - "command_failed — one command returned no result while another succeeded"
  logs:
    timestamp:        "UTC ISO-8601, when the call started"
    tool:             "get_device_status"
    caller:           "what invoked it - agent session ID, 'cli', or job name"
    requested_device: "device exactly as specified in the argument"
    approved:         "true | false - did it pass inventory/approved_devices.yml"
    target_address:   "address actually used"
    command_sent:     "exact commands issued - show version, show hostname"
    outcome:          "successful | refused | error"
    blocked_reason:   "which blocked_when case fired - not_approved | hostname_mismatch |
                       auth_rejected | eapi_refused | no_response | command_failed"
    detail:           "the observation, not the conclusion - 'curl exit 7',
                       'requested leaf1, device said leaf2'"
    duration_ms:      "elapsed time of the call"