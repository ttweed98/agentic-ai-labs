!
hostname spine2
!
interface Ethernet1
   description P2P_TO_LEAF1
   no switchport
   ip address 10.1.2.1/31
   
!
interface Ethernet2
   description P2P_TO_LEAF2
   no switchport
   ip address 10.2.2.1/31
   
!
interface Loopback0
   ip address 10.0.0.2/32
!
router bgp 65001
   router-id 10.0.0.2
   neighbor 10.1.2.0 remote-as 65002
   neighbor 10.2.2.0 remote-as 65003
   network 10.0.0.2/32


!
username admin privilege 15 role network-admin secret admin
!
management api http-commands
   no shutdown
   vrf MGMT
      no shutdown
!
management api gnmi
   transport grpc default
   no shutdown
!
management api netconf
   transport ssh default
!
vrf instance MGMT
!
interface Management0
   vrf MGMT
   no shutdown
!
ip routing
!
ip routing vrf MGMT
!
management ssh
   vrf MGMT
      no shutdown
!
end