---
check_bgp_neighbors:
  owner: "Network Automation Team"
  purpose: "Return the state of each BGP peer on the requested device, as the device itself reports it"
  arguments:
    device:
      type: string
      required: true
      validation: "must be present in inventory/approved_devices.yml"
  returns:
    local_asn:
      type: string
      source: "show ip bgp summary | json → vrfs.default.asn"
      example: "65002"
    router_id:
      type: string
      source: "show ip bgp summary | json → vrfs.default.routerId"
      example: "10.1.0.1"
    peers:
      type: "list of peer records — VRF default only"
      source: "show ip bgp summary | json → vrfs.default.peers"
      record:
        peer_address:
          type: string
          source: "the key of each entry in vrfs.default.peers"
          example: "10.1.9.9"
        remote_asn:
          type: string
          source: "vrfs.default.peers.<peer>.asn"
          example: "65999"
        peer_state:
          type: string
          source: "vrfs.default.peers.<peer>.peerState"
          example: "Idle"
        idle_reason:
          type: string
          source: "vrfs.default.peers.<peer>.peerStateIdleReason"
          note: "present only when the peer is Idle; empty string otherwise"
          example: "NoInterface"
        prefixes_received:
          type: integer
          source: "vrfs.default.peers.<peer>.prefixReceived"
          example: 3
        prefixes_accepted:
          type: integer
          source: "vrfs.default.peers.<peer>.prefixAccepted"
          note: "lower than prefixes_received when an inbound filter is rejecting prefixes"
          example: 3
        messages_received:
          type: integer
          source: "vrfs.default.peers.<peer>.msgReceived"
          note: "zero in both directions means the session has never exchanged anything"
          example: 0
        messages_sent:
          type: integer
          source: "vrfs.default.peers.<peer>.msgSent"
          example: 0
  blocked_when:
    - "not_approved — device not present in inventory/approved_devices.yml"
    - "not_in_topology — approved, but no entry in topology-data.json"
    - "wrong_kind — approved name, but the node is not an arista_ceos device"
    - "no_credentials — EOS_USERNAME or EOS_PASSWORD is not set"
    - "no_response — no answer from the target address within the timeout"
    - "connect_failed — could not establish a connection. Cause not determinable from the
       client: refused, no route, or DNS failure"
    - "auth_rejected — credentials refused by the device (HTTP 401)"
    - "command_failed — the device returned an error for a command"
    - "hostname_mismatch — the device reported a different hostname than the one requested"
    - "incomplete_result — a peer record omitted a field the contract promises"
    - "no_peers — the device returned no BGP peers at all in VRF default"
  logs:
    timestamp:        "UTC ISO-8601, when the call started"
    tool:             "check_bgp_neighbors"
    caller:           "what invoked it - agent session ID, 'cli', or job name"
    requested_device: "device exactly as specified in the argument"
    approved:         "true | false - did it pass inventory/approved_devices.yml"
    target_address:   "address actually used"
    command_sent:     "exact commands issued"
    outcome:          "successful | refused | error"
    blocked_reason:   "the token of the blocked_when case that fired; null on success"
    detail:           "the observation, not the conclusion"
    peer_count:       "how many peer records were returned"
    duration_ms:      "elapsed time of the call"